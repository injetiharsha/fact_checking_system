seed: 42
model:
  name: checkpoints/stance/stage1_public
  fallback_models:
    - microsoft/deberta-v3-small
data:
  train_file: data/stance/stage2_hardcases/train.jsonl
  validation_file: data/stance/stage2_hardcases/validation.jsonl
  test_file: data/stance/stage2_hardcases/test.jsonl
  tokenized_cache_dir: training_artifacts/stance/stage2_hardcases/tokenized_dataset
training:
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1.0e-5
  epochs: 4
  max_length: 256
  logging_steps: 10
  early_stopping_patience: 2
  save_total_limit: 2
output:
  checkpoint_dir: checkpoints/stance/stage2_hardcases
  metrics_dir: training_artifacts/stance/stage2_hardcases
