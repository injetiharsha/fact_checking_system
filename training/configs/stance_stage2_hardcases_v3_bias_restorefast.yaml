seed: 42
model:
  name: checkpoints/stance/stage1_public_small_restorefast
  fallback_models:
  - microsoft/deberta-v3-small
data:
  train_file: data/stance/stage2_hardcases_v3_bias/train.jsonl
  validation_file: data/stance/stage2_hardcases_v3_bias/validation.jsonl
  test_file: data/stance/stage2_hardcases_v3_bias/test.jsonl
  tokenized_cache_dir: training_artifacts/stance/stage2_hardcases_v3_bias_restorefast/tokenized_dataset
training:
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 1.0e-05
  epochs: 50
  max_length: 192
  logging_steps: 20
  early_stopping_patience: 12
  save_total_limit: 4
  dataloader_num_workers: 0
  group_by_length: false
output:
  checkpoint_dir: checkpoints/stance/stage2_hardcases_v3_bias_restorefast
  metrics_dir: training_artifacts/stance/stage2_hardcases_v3_bias_restorefast
