seed: 42
model:
  name: microsoft/deberta-v3-small
  fallback_models:
    - MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
    - cross-encoder/nli-deberta-v3-small
data:
  train_file: data/stance/stage1_public/train.jsonl
  validation_file: data/stance/stage1_public/validation.jsonl
  test_file: data/stance/stage1_public/test.jsonl
  tokenized_cache_dir: training_artifacts/stance/stage1_public/tokenized_dataset
training:
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 2.0e-5
  epochs: 2
  max_length: 256
  logging_steps: 50
  early_stopping_patience: 2
  save_total_limit: 2
output:
  checkpoint_dir: checkpoints/stance/stage1_public
  metrics_dir: training_artifacts/stance/stage1_public
