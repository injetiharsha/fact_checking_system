seed: 42
splits:
  validation_ratio: 0.15
  test_ratio: 0.15
sources:
  - key: fever
    enabled: true
    dataset_name: fever
    dataset_kwargs:
      name: v1.0
    split: paper_dev
    sample_limit: 2000
  - key: mnli
    enabled: true
    dataset_name: multi_nli
    split: validation_matched
    sample_limit: 2000
  - key: scifact
    enabled: false
    dataset_name: allenai/scifact
    split: train
    sample_limit: 1000
  - key: xnli_hi
    enabled: true
    dataset_name: xnli
    dataset_kwargs:
      language: hi
    split: train
    sample_limit: 20000
