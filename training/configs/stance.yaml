seed: 42
model:
  name: microsoft/deberta-v3-small
data:
  train_file: data/stance/v1/train.jsonl
  validation_file: data/stance/v1/validation.jsonl
training:
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 2.0e-5
  epochs: 3
  max_length: 256
  logging_steps: 10
output:
  checkpoint_dir: checkpoints/stance/latest
  metrics_dir: training_artifacts/stance
