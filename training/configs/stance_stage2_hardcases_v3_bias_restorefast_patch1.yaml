seed: 42
model:
  name: checkpoints/stance/stage2_hardcases_v3_bias_restorefast
  fallback_models:
  - microsoft/deberta-v3-small
data:
  train_file: data/stance/stage2_hardcases_v3_bias_restorefast_patch1/train.jsonl
  validation_file: data/stance/stage2_hardcases_v3_bias_restorefast_patch1/validation.jsonl
  test_file: data/stance/stage2_hardcases_v3_bias_restorefast_patch1/test.jsonl
  tokenized_cache_dir: training_artifacts/stance/stage2_hardcases_v3_bias_restorefast_patch1/tokenized_dataset
training:
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 7.5e-06
  epochs: 8
  max_length: 192
  logging_steps: 10
  early_stopping_patience: 4
  save_total_limit: 3
  dataloader_num_workers: 0
  group_by_length: false
output:
  checkpoint_dir: checkpoints/stance/stage2_hardcases_v3_bias_restorefast_patch1
  metrics_dir: training_artifacts/stance/stage2_hardcases_v3_bias_restorefast_patch1
