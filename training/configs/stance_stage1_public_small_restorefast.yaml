seed: 42
model:
  name: microsoft/deberta-v3-small
  fallback_models:
  - MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  - cross-encoder/nli-deberta-v3-small
data:
  train_file: data/stance/stage1_public_small/train.jsonl
  validation_file: data/stance/stage1_public_small/validation.jsonl
  test_file: data/stance/stage1_public_small/test.jsonl
  tokenized_cache_dir: training_artifacts/stance/stage1_public_small_restorefast/tokenized_dataset
training:
  batch_size: 16
  eval_batch_size: 16
  learning_rate: 2.0e-05
  epochs: 1
  max_length: 192
  logging_steps: 50
  early_stopping_patience: 2
  save_total_limit: 2
output:
  checkpoint_dir: checkpoints/stance/stage1_public_small_restorefast
  metrics_dir: training_artifacts/stance/stage1_public_small_restorefast
