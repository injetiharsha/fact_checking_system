seed: 42
model:
  name: microsoft/deberta-v3-small
  fallback_models:
    - distilbert-base-uncased
data:
  train_file: data/claim_type/v1/train.jsonl
  validation_file: data/claim_type/v1/validation.jsonl
  test_file: data/claim_type/v1/test.jsonl
training:
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 2.0e-5
  epochs: 50
  max_length: 128
  logging_steps: 10
  early_stopping_patience: 5
  save_total_limit: 2
output:
  checkpoint_dir: checkpoints/claim_type/latest
  metrics_dir: training_artifacts/claim_type
