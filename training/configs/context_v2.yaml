seed: 42

model:
  name: microsoft/deberta-v3-small
  fallback_models:
    - distilbert-base-uncased

data:
  train_file: data/context/v2/train.jsonl
  validation_file: data/context/v2/validation.jsonl
  test_file: data/context/v2/test.jsonl

training:
  batch_size: 8
  eval_batch_size: 8
  learning_rate: 2e-5
  epochs: 50
  max_length: 128
  logging_steps: 10
  save_total_limit: 2
  early_stopping_patience: 5

output:
  checkpoint_dir: checkpoints/context/v2
  metrics_dir: training_artifacts/context/v2
